<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unified Booking Management Portal - Admin & Partner Control</title>
  <!-- Google Fonts & Bootstrap 5 & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-dark">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 56px; height: 56px; font-size: 26px;">
          <i class="fa-solid fa-hotel"></i>
        </div>
        <h3 class="fw-bold mb-1 text-slate-900">Booking Management Portal</h3>
        <p class="text-muted small">Unified Web Control Center for Administrators & Business Partners</p>
      </div>

      <!-- Real Dynamic Login Form -->
      <form id="loginForm" action="javascript:void(0);" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label small fw-semibold text-secondary">Email Address or Phone Number</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-regular fa-envelope"></i></span>
            <input type="text" id="email" class="form-control border-start-0 ps-0" placeholder="Enter your email or phone number" required autocomplete="username" enterkeyhint="next">
          </div>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between">
            <label class="form-label small fw-semibold text-secondary">Password</label>
            <a href="javascript:void(0)" onclick="Swal.fire('Password Reset', 'Please contact system administrator to reset your credentials.', 'info')" class="text-decoration-none small text-muted">Forgot?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="password" class="form-control border-start-0 border-end-0 ps-0" placeholder="••••••••" required autocomplete="current-password" enterkeyhint="go">
            <button class="btn btn-outline-secondary border border-start-0 bg-white text-muted" type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility('password', 'togglePasswordIcon')" title="Show password" style="border-color: #dee2e6 !important;">
              <i class="fa-regular fa-eye-slash" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-navy w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
          <span>Sign In to Dashboard</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- Register Modal for Business Partner / Hotel Owner -->
  <div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">
            <i class="fa-solid fa-hotel text-warning me-2"></i> Register New Business Partner
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="modal-body p-4">
            <div class="row g-3">
              <div class="col-12">
                <h6 class="fw-bold text-primary mb-2 border-bottom pb-1">1. Partner Account Information</h6>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Contact Full Name * <span class="text-primary fw-normal">(Letters only)</span></label>
                <input type="text" id="regFullName" class="form-control" required placeholder="e.g. Sokly Meas" oninput="this.value = this.value.replace(/[0-9@#$%^&*()_+=\[\]{};:&quot;\\|<>\/?~`!]/g, '')">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Phone Number * <span class="text-success fw-normal">(Numbers only)</span></label>
                <input type="tel" id="regPhone" class="form-control" required maxlength="12" placeholder="012345678" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Email Address *</label>
                <input type="email" id="regEmail" class="form-control" required placeholder="partner@domain.com">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Password *</label>
                <div class="input-group">
                  <input type="password" id="regPassword" class="form-control border-end-0" required placeholder="At least 6 characters" minlength="6">
                  <button class="btn btn-outline-secondary border border-start-0 bg-white text-muted" type="button" onclick="togglePasswordVisibility('regPassword', 'toggleRegPasswordIcon')" title="Show password" style="border-color: #dee2e6 !important;">
                    <i class="fa-regular fa-eye-slash" id="toggleRegPasswordIcon"></i>
                  </button>
                </div>
              </div>

              <div class="col-12 mt-4">
                <h6 class="fw-bold text-primary mb-2 border-bottom pb-1">2. Business Property & Location Details</h6>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Business / Hotel Name *</label>
                <input type="text" id="regHotelName" class="form-control" required placeholder="e.g. River Sanctuary Boutique">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Province / City *</label>
                <select id="regHotelProvince" class="form-select" required>
                  <option value="Phnom Penh" selected>Phnom Penh</option>
                  <option value="Siem Reap">Siem Reap</option>
                  <option value="Preah Sihanouk">Preah Sihanouk</option>
                  <option value="Kampot">Kampot</option>
                  <option value="Kep">Kep</option>
                  <option value="Battambang">Battambang</option>
                  <option value="Koh Kong">Koh Kong</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label small fw-semibold">Detailed Address *</label>
                <input type="text" id="regHotelAddress" class="form-control" required placeholder="e.g. St. 240, Daun Penh, Phnom Penh">
              </div>
              <div class="col-12">
                <label class="form-label small fw-semibold">Business Description</label>
                <textarea id="regHotelDescription" class="form-control" rows="2" placeholder="Briefly describe your services, facilities, and guest highlights..."></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" id="regSubmitBtn" class="btn btn-gold">
              <i class="fa-solid fa-paper-plane me-1"></i> Submit Registration
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input || !icon) return;

      if (input.type === 'password') {
        // Change from Hidden (dots) to Visible (text)
        input.type = 'text';
        icon.className = 'fa-regular fa-eye';
        if (icon.parentElement) icon.parentElement.setAttribute('title', 'Hide password');
      } else {
        // Change from Visible (text) back to Hidden (dots)
        input.type = 'password';
        icon.className = 'fa-regular fa-eye-slash';
        if (icon.parentElement) icon.parentElement.setAttribute('title', 'Show password');
      }
    }

    function quickLogin(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      handleLogin(new Event('submit', { cancelable: true }));
    }

    // Support pressing Enter key seamlessly from Email and Password fields
    document.addEventListener('DOMContentLoaded', () => {
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');

      if (emailInput) {
        emailInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.keyCode === 13) {
            e.preventDefault();
            if (passwordInput && !passwordInput.value) {
              passwordInput.focus();
            } else {
              handleLogin(e);
            }
          }
        });
      }

      if (passwordInput) {
        passwordInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.keyCode === 13) {
            e.preventDefault();
            handleLogin(e);
          }
        });
      }
    });

    async function handleLogin(e) {
      if (e && typeof e.preventDefault === 'function') {
        e.preventDefault();
      }
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const email = emailInput ? emailInput.value.trim() : '';
      const password = passwordInput ? passwordInput.value : '';
      const btn = document.getElementById('loginBtn');

      if (!email) {
        Swal.fire({
          icon: 'warning',
          title: 'Missing Email or Phone',
          text: 'Please enter your email address or phone number.'
        });
        if (emailInput) emailInput.focus();
        return;
      }

      if (!password) {
        Swal.fire({
          icon: 'warning',
          title: 'Missing Password',
          text: 'Please enter your account password.'
        });
        if (passwordInput) passwordInput.focus();
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';

      try {
        const res = await ApiService.login(email, password);
        Auth.setSession(res.token, {
          id: res.id,
          fullName: res.fullName,
          email: res.email,
          phone: res.phone,
          role: res.role,
          hotelId: res.hotelId
        });

        Toast.fire('success', `Welcome back, ${res.fullName}!`);

        setTimeout(() => {
          if (res.role === 'ADMIN' || res.role === 'HOTEL_OWNER' || res.role === 'PROVIDER') {
            window.location.href = 'admin-dashboard.html';
          } else {
            Swal.fire({
              icon: 'info',
              title: 'Customer Account',
              text: 'You are signed in as a Customer. Please access your bookings and appointments using the Flutter Customer Mobile App!',
              confirmButtonText: 'OK'
            });
            btn.disabled = false;
            btn.innerHTML = '<span>Sign In to Dashboard</span> <i class="fa-solid fa-arrow-right"></i>';
          }
        }, 800);
      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: 'Login Failed',
          text: err.message || 'Invalid credentials. Please verify your email/phone and password.'
        });
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In to Dashboard</span> <i class="fa-solid fa-arrow-right"></i>';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const fullName = document.getElementById('regFullName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();

      if (/[0-9]/.test(fullName) || fullName.length < 2) {
        Swal.fire('Invalid Full Name', 'Full name must contain letters only (no numbers).', 'warning');
        return;
      }
      if (!/^[0-9]{8,12}$/.test(phone)) {
        Swal.fire('Invalid Phone Number', 'Phone number must contain 8 to 12 digits (numbers only).', 'warning');
        return;
      }

      const submitBtn = document.getElementById('regSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Submitting...';

      const payload = {
        fullName,
        phone,
        email: document.getElementById('regEmail').value.trim(),
        password: document.getElementById('regPassword').value,
        role: 'HOTEL_OWNER',
        hotelName: document.getElementById('regHotelName').value.trim(),
        hotelProvince: document.getElementById('regHotelProvince').value,
        hotelAddress: document.getElementById('regHotelAddress').value.trim(),
        hotelDescription: document.getElementById('regHotelDescription').value.trim()
      };

      try {
        const res = await ApiService.register(payload);
        Auth.setSession(res.token, {
          id: res.id,
          fullName: res.fullName,
          email: res.email,
          phone: res.phone,
          role: res.role,
          hotelId: res.hotelId
        });

        bootstrap.Modal.getInstance(document.getElementById('registerModal')).hide();

        Swal.fire({
          icon: 'success',
          title: 'Registration Successful!',
          text: 'Your partner account has been created. Redirecting to your dashboard...',
          timer: 1500,
          showConfirmButton: false
        }).then(() => {
          window.location.href = 'owner-dashboard.html';
        });
      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: 'Registration Error',
          text: err.message || 'Could not register business partner'
        });
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane me-1"></i> Submit Registration';
      }
    }
  </script>
</body>
</html>
